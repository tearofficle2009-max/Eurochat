<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuroChat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050B14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            position: absolute;
            top: 0;
            transition: opacity 0.5s ease-in-out;
        }

        /* --- 1. Splash Screen Style --- */
        #splash-screen {
            justify-content: center;
            z-index: 2;
            background-color: #050B14;
        }

        .logo-box {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 2px solid #00f0ff;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            margin-bottom: 25px;
        }

        .logo-box h1 {
            color: #00f0ff;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .app-title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .app-subtitle {
            color: #8a99ad;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top: 3px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* --- 2. Welcome Screen Style --- */
        #welcome-screen {
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            text-align: center;
        }

        .welcome-content {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome-logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 2px solid #00f0ff;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            margin-bottom: 20px;
        }

        .welcome-logo h2 {
            color: #00f0ff;
            font-size: 45px;
        }

        .welcome-heading {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .welcome-desc {
            color: #8a99ad;
            font-size: 14px;
            line-height: 1.5;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        .btn-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-primary {
            background-color: #00f0ff;
            color: #050B14;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-outline {
            background-color: transparent;
            color: #00f0ff;
            border: 1px solid #00f0ff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- 1. Splash Screen -->
    <div id="splash-screen" class="screen">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="logo-box">
                <h1>E</h1>
            </div>
            <div class="app-title">EuroChat</div>
            <div class="app-subtitle">Connect Nearby • Stay Connected</div>
        </div>
        <div class="loader"></div>
    </div>

    <!-- 2. Welcome Screen -->
    <div id="welcome-screen" class="screen">
        <div></div> <!-- Spacer -->
        <div class="welcome-content">
            <div class="welcome-logo">
                <h2>E</h2>
            </div>
            <div class="welcome-heading">Welcome to EuroChat</div>
            <div class="welcome-desc">Connect with people around you nearby or worldwide effortlessly and securely.</div>
        </div>
        <div class="btn-container">
            <button class="btn btn-primary" onclick="alert('Login Screen သို့ ဆက်သွားပါမည်')">Login</button>
            <button class="btn btn-outline" onclick="alert('Create Account Screen သို့ ဆက်သွားပါမည်')">Create Account</button>
        </div>
    </div>

    <script>
        // ၂ စက္ကန့်ပြည့်တာနဲ့ Splash Screen ပျောက်ပြီး Welcome Screen ပေါ်လာမယ်
        setTimeout(() => {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                let welcome = document.getElementById('welcome-screen');
                welcome.style.opacity = '1';
                welcome.style.pointerEvents = 'auto';
            }, 500);
        }, 2000);
    </script>

</body>
</html>
