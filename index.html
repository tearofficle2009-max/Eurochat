<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuroChat - Splash Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050B14; /* Dark Navy Background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Logo Styling with Neon Blue Glow */
        .logo-box {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            border: 2px solid #00f0ff;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }

        .logo-box h1 {
            color: #00f0ff;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        /* App Title */
        .app-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* App Subtitle */
        .app-subtitle {
            color: #8a99ad;
            font-size: 14px;
            letter-spacing: 0.5px;
            margin-bottom: 40px;
        }

        /* Loading Spinner */
        .loader {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top: 3px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
            50% { box-shadow: 0 0 30px rgba(0, 240, 255, 0.8); }
            100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <!-- Logo -->
        <div class="logo-box">
            <h1>E</h1>
        </div>
        
        <!-- App Name & Slogan -->
        <div class="app-title">EuroChat</div>
        <div class="app-subtitle">Connect Nearby • Stay Connected</div>

        <!-- Loading Indicator -->
        <div class="loader"></div>
    </div>

</body>
</html>
